freeze_requirements:
  - Resolve effective dates and applicability for each included requirement with authoritative evidence.
  - Retrieve and preserve exact source bytes in the experiment source bundle.
  - Record retrieval timestamp, raw SHA-256, snapshot location, and response metadata.
  - Extract and review requirement text with conditions, exceptions, and related definitions.
  - Record normalized-text SHA-256, extraction version, and stable requirement IDs.
  - Verify redistribution permissions before committing full source documents; retain retrievable artifact references where appropriate.
  - Freeze the same source pack for generator, both evaluators, and human reviewers.
  - Block generation against any source lacking required provenance or unresolved applicability.
